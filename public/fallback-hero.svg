<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#cc6f3a" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#cc6f3a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#cc6f3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Black field -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Soft amber glow on the left -->
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- Vertical amber accent bar on the left edge -->
  <rect x="0" y="0" width="14" height="900" fill="#cc6f3a"/>
  <!-- Wordmark, bottom-right -->
  <g font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-weight="700" letter-spacing="2">
    <text x="1500" y="830" text-anchor="end" fill="#ffffff" font-size="46">MONO</text>
    <text x="1500" y="830" text-anchor="end" fill="#cc6f3a" font-size="46" dx="170">KROMATIK</text>
  </g>
  <!-- Subtle "NETWORK" caption under wordmark -->
  <text x="1500" y="864" text-anchor="end" fill="#666666" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="18" letter-spacing="6">NETWORK</text>
</svg>
