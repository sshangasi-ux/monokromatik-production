name: Operator's Daily Brief

# A deterministic daily review of backend operations — growth, monetisation,
# insight-mining and product refinement — emailed to the operator (Resend),
# posted to the run summary, and committed to docs/briefs/YYYY-MM-DD.md.
# No AI/credits needed, so it always delivers. The deep competitive take is the
# monthly strategy review (1st of the month).

on:
  schedule:
    - cron: '30 5 * * *' # daily 05:30 UTC (07:30 SAST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Generate + deliver the brief
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DAILY_BRIEF_TO: ${{ vars.DAILY_BRIEF_TO }}
          EIC_DIGEST_FROM: ${{ vars.EIC_DIGEST_FROM }}
          NEXT_PUBLIC_PAYSTACK_REPORT_URL: ${{ vars.NEXT_PUBLIC_PAYSTACK_REPORT_URL }}
          NEXT_PUBLIC_PAYSTACK_MEMBERSHIP_INDIVIDUAL_URL: ${{ vars.NEXT_PUBLIC_PAYSTACK_MEMBERSHIP_INDIVIDUAL_URL }}
          NEXT_PUBLIC_PAYSTACK_MEMBERSHIP_TEAM_URL: ${{ vars.NEXT_PUBLIC_PAYSTACK_MEMBERSHIP_TEAM_URL }}
        run: npm run brief:daily

      - name: Publish the brief to the daily-briefs branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain docs/briefs)" ]; then
            echo "No brief file this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "MonoKromatik Agent"
          git config user.email "agents@monokromatik.com"
          # main is a protected branch (requires PRs), so a direct push is rejected.
          # Land the brief on a dedicated, non-protected branch that accumulates the
          # daily reports — searchable in the repo, no PR/CI noise. The brief is also
          # emailed (Resend) and posted to this run summary.
          git fetch origin daily-briefs >/dev/null 2>&1 || true
          # Carry the freshly-generated brief across the branch switch via a temp dir.
          #
          # This used to use `git stash push -u` + `git checkout stash@{0} -- docs/briefs`,
          # which SILENTLY DROPPED THE BRIEF ON EVERY RUN: `docs/briefs` does not exist on
          # main, so the new file is always UNTRACKED, and `stash push -u` stores untracked
          # entries in stash@{0}^3 — not stash@{0}. The restore therefore never matched,
          # failed quietly behind `|| true`, and the step exited "already current" with
          # nothing staged. The archive silently stopped for a week while the email kept
          # sending, so nothing looked broken. A plain copy has no such semantics.
          BRIEF_TMP="$(mktemp -d)"
          cp -R docs/briefs/. "$BRIEF_TMP"/ 2>/dev/null || true
          git checkout -B daily-briefs origin/daily-briefs 2>/dev/null || git checkout -B daily-briefs
          mkdir -p docs/briefs
          cp -R "$BRIEF_TMP"/. docs/briefs/ 2>/dev/null || true
          rm -rf "$BRIEF_TMP"
          git add docs/briefs
          # Prove the file survived the switch — never publish an empty commit silently.
          if [ -z "$(git status --porcelain --staged docs/briefs 2>/dev/null)" ] && git diff --cached --quiet; then
            echo "⚠️ Brief did not survive the branch switch — investigate." >> "$GITHUB_STEP_SUMMARY"
          fi
          if git diff --cached --quiet; then
            echo "Brief already current on daily-briefs — nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "docs(brief): operator daily brief — $(date -u +%Y-%m-%d)"
          git push origin daily-briefs
          echo "Brief published to the daily-briefs branch." >> "$GITHUB_STEP_SUMMARY"
