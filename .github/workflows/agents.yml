name: MonoKromatik Daily Discovery and Review Run

on:
  schedule:
    # 06:00 SAST = 04:00 UTC (every day)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of candidate articles to generate for review'
        required: false
        default: '3'
        type: string

# Pre-launch governance: agents may discover, draft and review, but must not
# commit editorial output directly into production content.
permissions:
  contents: read

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run agent pipeline in review-only mode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EIC_DIGEST_TO: ${{ secrets.EIC_DIGEST_TO }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MONOKROMATIK_PUBLICATION_MODE: review_only
          NODE_ENV: production
        run: |
          # --no-push permits internal review output and digest generation while
          # ensuring no generated article is pushed to the public branch.
          npm run agents -- --count=${{ github.event.inputs.count || '3' }} --no-push

      - name: Pipeline summary
        if: always()
        run: |
          echo "### MonoKromatik discovery and review run finished" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Candidate articles reviewed. No automated publication or production deployment performed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Discovery/review run failed — check logs above." >> $GITHUB_STEP_SUMMARY
          fi
