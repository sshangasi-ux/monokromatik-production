name: MonoKromatik Cultural-Signal Index snapshot (weekly)

on:
  schedule:
    # Weekly, Mondays at 04:09 UTC. Records the current ranking so the Index shows
    # movement over time. Weekly (not monthly) so the "living index" accrues a
    # usable history and new/rescored case studies surface as movement sooner.
    - cron: '9 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: index-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Snapshot the Index
        run: npm run index:snapshot

      - name: Open a PR with the snapshot
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # main is branch-protected (PR-only) — stage the snapshot as a PR, not a
          # direct push. The snapshot must land in the repo (the site reads it).
          if [ -z "$(git status --porcelain data/index-history.json)" ]; then
            echo "No Index change this month — snapshot already recorded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="index/snapshot-${{ github.run_id }}"
          git config user.name "MonoKromatik Agent"
          git config user.email "agents@monokromatik.com"
          git checkout -b "$BRANCH"
          git add data/index-history.json
          git commit -m "chore(index): monthly Cultural-Signal Index snapshot"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Cultural-Signal Index snapshot — $(date -u +%Y-%m-%d)" \
            --body "Monthly Index snapshot — records the current ranking so the Index shows movement over time. Mechanical/derived data; merge to keep history accruing." || true
          echo "Recorded a new Index snapshot." >> "$GITHUB_STEP_SUMMARY"
