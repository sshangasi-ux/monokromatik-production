name: MonoKromatik Content Engine Cycle (weekly review queue)

on:
  schedule:
    # Weekly, Monday 05:07 SAST = 03:07 UTC. Off the :00 mark on purpose.
    - cron: '7 3 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated sections to run (signal,intelligence,issues,conversations,culture). Blank = all.'
        required: false
        default: ''
        type: string
      searches:
        description: 'Max web searches per section'
        required: false
        default: '6'
        type: string

# Review-gated: the engine sources + drafts across all five sections into a review
# queue, then STAGES it as a Pull Request. Nothing reaches the live site without a
# human merging that PR — discovery + drafting are automated, publish is human-gated.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: engine-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run the content engine cycle (web-sourced, integrity-gated)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONO_MODEL_FLAGSHIP: ${{ secrets.MONO_MODEL_FLAGSHIP }}
          NODE_ENV: production
        run: |
          ONLY="${{ github.event.inputs.only }}"
          SEARCHES="${{ github.event.inputs.searches || '6' }}"
          ARGS="-- --searches=$SEARCHES"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only=$ONLY"; fi
          npm run engine:cycle $ARGS

      - name: Gate + auto-patch drafts (deterministic gates; Culture auto-staged)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONO_MODEL_UTILITY: ${{ secrets.MONO_MODEL_UTILITY }}
          # Media keys so auto-patched Culture articles always get a credited hero
          # (publisher OG is keyless; these power the stock fallback).
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NODE_ENV: production
        run: |
          # Source-count + dedup-vs-archive + schema gates. Low-stakes Culture
          # articles are auto-patched into data/articles.json WITH a sourced hero
          # image; claim-bearing kinds are routed to human authoring.
          npm run engine:stage

      - name: Stage the review queue + patches as a Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain output/engine-cycle data)" ]; then
            echo "No changes to the engine review queue or data this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="engine/cycle-${{ github.run_id }}"
          git config user.name "MonoKromatik Agent"
          git config user.email "agents@monokromatik.com"
          git checkout -b "$BRANCH"
          git add output/engine-cycle data
          git commit -m "feat(engine): weekly content cycle — review queue + gated patches" -m "AI-sourced + drafted across all five sections, then deterministically gated (≥2 sources, dedup-vs-archive, schema). Low-stakes Culture articles auto-patched into data/articles.json; claim-bearing items staged for human authoring. See output/engine-cycle/STAGED.md. Merging this PR is the publish step."
          git push origin "$BRANCH"

          BODY="Weekly content engine cycle — now with the staging gate. AI-sourced + drafted across all five sections (live web search, integrity contract), then run through deterministic gates (≥2 independent sources · dedup vs the existing archive · schema). **Start at \`output/engine-cycle/STAGED.md\`** for the per-item verdicts. Low-stakes Culture articles that pass every gate are auto-patched into \`data/articles.json\` (review the data diff); claim-bearing Signal/Intelligence/Issue items and possible duplicates are staged as proposals for human authoring — never fabricated whole. **Merging this PR is the publish step**; close it to discard. See \`docs/CONTENT_ENGINE_CYCLE.md\`."
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Engine cycle — review queue + gated patches — $(date -u +%Y-%m-%d)" --body "$BODY") || true

          if [ -n "$PR_URL" ]; then
            echo "Opened PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Queue pushed to $BRANCH; open a PR from that branch if one was not created automatically." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run summary
        if: always()
        run: |
          echo "### MonoKromatik content engine cycle finished" >> "$GITHUB_STEP_SUMMARY"
          echo "Time: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Cross-section queue refreshed, gated, and staged as a PR (STAGED.md has the verdicts). Publish = merging the PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Run failed — check logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
