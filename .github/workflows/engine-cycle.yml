name: MonoKromatik Content Engine Cycle (weekly review queue)

on:
  schedule:
    # Weekly, Monday 05:07 SAST = 03:07 UTC. Off the :00 mark on purpose.
    - cron: '7 3 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated sections to run (signal,intelligence,issues,conversations,culture). Blank = all.'
        required: false
        default: ''
        type: string
      searches:
        description: 'Max web searches per section'
        required: false
        default: '6'
        type: string

# Review-gated: the engine sources + drafts across all five sections into a review
# queue, then STAGES it as a Pull Request. Nothing reaches the live site without a
# human merging that PR — discovery + drafting are automated, publish is human-gated.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: engine-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run the content engine cycle (web-sourced, integrity-gated)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONO_MODEL_FLAGSHIP: ${{ secrets.MONO_MODEL_FLAGSHIP }}
          NODE_ENV: production
        run: |
          ONLY="${{ github.event.inputs.only }}"
          SEARCHES="${{ github.event.inputs.searches || '6' }}"
          ARGS="-- --searches=$SEARCHES"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only=$ONLY"; fi
          npm run engine:cycle $ARGS

      - name: Gate + auto-patch drafts (deterministic gates; Culture auto-staged)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONO_MODEL_UTILITY: ${{ secrets.MONO_MODEL_UTILITY }}
          # Media keys so auto-patched Culture articles always get a credited hero
          # (publisher OG is keyless; these power the stock fallback).
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NODE_ENV: production
        run: |
          # Source-count + dedup-vs-archive + schema gates. Low-stakes Culture
          # articles are auto-patched into data/articles.json WITH a sourced hero
          # image; claim-bearing kinds are routed to human authoring.
          npm run engine:stage

      - name: Stage the review queue + patches as a Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # STAGED.md (the per-item verdicts) lives in gitignored output/ — surface it
          # in the run summary + PR body rather than `git add`-ing an ignored path
          # (which fails with exit 1 and drops the whole run).
          if [ -f output/engine-cycle/STAGED.md ]; then
            { echo "### Engine cycle — staged verdicts"; echo; cat output/engine-cycle/STAGED.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Only the tracked data/ patches are committable. If nothing was auto-patched,
          # the staged proposals are drafts only (surfaced above) — no PR to open.
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No auto-patched content to publish this run (any staged proposals are in the verdicts above)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="engine/cycle-${{ github.run_id }}"
          git config user.name "MonoKromatik Agent"
          git config user.email "agents@monokromatik.com"
          git checkout -b "$BRANCH"
          git add data
          git commit -m "feat(engine): weekly content cycle — gated auto-patches" -m "AI-sourced + drafted across all five sections, then deterministically gated (>=2 sources, dedup-vs-archive, schema). Low-stakes Culture articles auto-patched into data/articles.json; claim-bearing items staged for human authoring (verdicts in the PR body). Merging this PR is the publish step."
          git push origin "$BRANCH"

          {
            echo "Weekly content engine cycle. Low-stakes Culture articles that passed every gate (>=2 independent sources, dedup vs the archive, schema) are auto-patched into \`data/articles.json\` — review the data diff. Claim-bearing Signal/Intelligence/Issue items are staged as proposals for human authoring, never fabricated whole. **Merging this PR is the publish step**; close it to discard. See \`docs/CONTENT_ENGINE_CYCLE.md\`."
            echo
            echo "### Per-item verdicts (STAGED.md)"
            echo
            if [ -f output/engine-cycle/STAGED.md ]; then cat output/engine-cycle/STAGED.md; fi
          } > "$RUNNER_TEMP/engine-pr-body.md"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Engine cycle — gated content patches — $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/engine-pr-body.md") || true

          if [ -n "$PR_URL" ]; then
            echo "Opened PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Queue pushed to $BRANCH; open a PR from that branch if one was not created automatically." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run summary
        if: always()
        run: |
          echo "### MonoKromatik content engine cycle finished" >> "$GITHUB_STEP_SUMMARY"
          echo "Time: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Cross-section queue refreshed, gated, and staged as a PR (STAGED.md has the verdicts). Publish = merging the PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Run failed — check logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
