name: SEO Watchdog

# Weekly SEO + structured-data integrity check against the LIVE site (what crawlers
# see). Validates that every sitemap.xml URL resolves 200, key page types carry
# valid JSON-LD, pages have og:image + canonical, and robots/llms.txt resolve.
# SEO is the growth moat for a depth-led publication — this catches silent
# deploy-time regressions. Read-only: opens/reuses a tracking issue on problems.

on:
  schedule:
    - cron: '45 3 * * 5' # Friday 03:45 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override target (e.g. a preview deploy). Blank = production.'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Check SEO + structured data
        env:
          SEO_BASE_URL: ${{ inputs.base_url }}
        run: npm run seo:check

      - name: Open / update a tracking issue on problems
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(python3 -c "import json;print(len(json.load(open('output/seo-health.json'))['problems']))")
          if [ "$COUNT" -eq 0 ]; then
            echo "✅ No SEO problems." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BODY=$(python3 -c "
          import json
          d=json.load(open('output/seo-health.json'))
          print(f\"The weekly SEO watchdog found **{len(d['problems'])} problem(s)** on {d['base']}.\n\")
          for p in d['problems']:
              print(f'- {p}')
          print('\n_Auto-generated by .github/workflows/seo-watchdog.yml. Fix and close._')
          ")

          TITLE="🔎 SEO check — $COUNT problem(s)"
          EXISTING=$(gh issue list --state open --search "SEO check in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated issue #$EXISTING" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh issue create --title "$TITLE" --body "$BODY" --label "seo" 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY")
            echo "Opened $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
