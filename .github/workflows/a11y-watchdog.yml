name: Accessibility Watchdog

# Weekly accessibility sweep of key page types using the axe-core ruleset (run in
# jsdom — no browser binary). Catches structural a11y regressions: images without
# alt, controls without accessible names, unlabelled form fields, invalid ARIA,
# bad heading/landmark structure. Color-contrast is excluded (needs a real
# browser). Read-only: opens/reuses a tracking issue only on serious/critical
# violations, so it doesn't cry wolf on broad known-moderate items.

on:
  schedule:
    - cron: '15 4 * * 2' # Tuesday 04:15 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override target (e.g. a preview deploy). Blank = production.'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: a11y-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run accessibility sweep
        env:
          SEO_BASE_URL: ${{ inputs.base_url }}
        run: npm run a11y:check

      - name: Open / update a tracking issue on serious violations
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(python3 -c "import json;print(len(json.load(open('output/a11y-health.json'))['actionable']))")
          if [ "$COUNT" -eq 0 ]; then
            echo "✅ No serious/critical a11y violations." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BODY=$(python3 -c "
          import json
          d=json.load(open('output/a11y-health.json'))
          print(f\"The weekly a11y watchdog found **{len(d['actionable'])} serious/critical violation(s)** on {d['base']}.\n\")
          for f in d['actionable']:
              print(f\"- **[{f['impact']}] {f['id']}** ×{f['count']} — {f['route']} — {f['help']}\")
          print('\n_Auto-generated by .github/workflows/a11y-watchdog.yml. Color-contrast is not covered here. Fix and close._')
          ")

          TITLE="♿ Accessibility — $COUNT serious violation(s)"
          EXISTING=$(gh issue list --state open --search "Accessibility in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated issue #$EXISTING" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh issue create --title "$TITLE" --body "$BODY" --label "a11y" 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY")
            echo "Opened $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
