name: MonoKromatik Breaking Radar (near-real-time)

# The always-on breaking-news pull: fetches the latest from trusted feeds, the
# model flags genuine major breaks in our focus segments, and an alert email goes
# out immediately. Deduped via a committed ledger so each story alerts once.
#
# CADENCE / COST: set to HOURLY to stay within the free Actions budget on a private
# repo. Tighten to '*/30' or '*/15' for more topicality (more Actions minutes; may
# need a paid plan). TRUE sub-minute / to-the-second detection needs a dedicated
# always-on worker or push/streaming feeds (the script is trigger-agnostic and ready
# for that) — this cron is the zero-infra "always-on" version.

on:
  schedule:
    # Hourly at :13 (off the :00 mark so runs don't pile onto the API together).
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'Look-back window in hours'
        required: false
        default: '3'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: breaking-radar
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Persist the dedup ledger via the Actions cache (NOT a commit) — main is
      # branch-protected (PR-only), so a direct push is rejected. A unique save
      # key + a prefix restore-key gives a rolling "latest ledger" between runs.
      - name: Restore radar ledger
        uses: actions/cache@v4
        with:
          path: output/breaking-ledger.json
          key: breaking-ledger-${{ github.run_id }}
          restore-keys: |
            breaking-ledger-

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Watch for breaking news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONO_MODEL_UTILITY: ${{ secrets.MONO_MODEL_UTILITY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EIC_DIGEST_TO: ${{ secrets.EIC_DIGEST_TO }}
          EIC_DIGEST_FROM: ${{ secrets.EIC_DIGEST_FROM }}
          NODE_ENV: production
        run: npm run breaking:watch -- --window=${{ github.event.inputs.window || '3' }}

      # The operator already got the instant email alert; this publishes the same
      # confirmed break(s) to The Wire as a one-click-merge PR. main is branch-
      # protected, so we open a PR rather than push. Breaks are infrequent (bar is
      # importance >= 4) — merge promptly / one at a time to avoid feed clobber.
      - name: Publish The Wire as a Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain data/breaking.json)" ]; then
            echo "No new breaks this run — The Wire unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="breaking/wire-${{ github.run_id }}"
          git config user.name "MonoKromatik Agent"
          git config user.email "agents@monokromatik.com"
          git checkout -b "$BRANCH"
          git add data/breaking.json
          git commit -m "feat(wire): publish confirmed break(s) to The Wire" -m "AI-confirmed (importance >= 4) from trusted feeds and already alerted. Merge to surface on /breaking + the homepage; close to discard."
          git push origin "$BRANCH"
          BODY="The breaking radar confirmed major break(s) in our focus segments and alerted you. This stages the same item(s) for The Wire (/breaking + homepage strip). Merge to publish; close to discard. Each entry carries source, importance, the one-line read and detection time."
          STAMP=$(date -u +"%Y-%m-%d %H:%MZ")
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "🔴 The Wire — breaking $STAMP" --body "$BODY") || true
          if [ -n "$PR_URL" ]; then
            echo "Opened Wire PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Break(s) pushed to $BRANCH; open a PR from that branch if one was not created." >> "$GITHUB_STEP_SUMMARY"
          fi
