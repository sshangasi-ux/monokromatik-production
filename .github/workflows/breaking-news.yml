name: MonoKromatik Breaking Radar (near-real-time)

# The always-on breaking-news pull: fetches the latest from trusted feeds, the
# model flags genuine major breaks in our focus segments, and an alert email goes
# out immediately. Deduped via a committed ledger so each story alerts once.
#
# CADENCE / COST: set to HOURLY to stay within the free Actions budget on a private
# repo. Tighten to '*/30' or '*/15' for more topicality (more Actions minutes; may
# need a paid plan). TRUE sub-minute / to-the-second detection needs a dedicated
# always-on worker or push/streaming feeds (the script is trigger-agnostic and ready
# for that) — this cron is the zero-infra "always-on" version.

on:
  schedule:
    # Hourly at :13 (off the :00 mark so runs don't pile onto the API together).
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'Look-back window in hours'
        required: false
        default: '3'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: breaking-radar
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Persist the dedup ledger via the Actions cache (NOT a commit) — main is
      # branch-protected (PR-only), so a direct push is rejected. A unique save
      # key + a prefix restore-key gives a rolling "latest ledger" between runs.
      - name: Restore radar ledger
        uses: actions/cache@v4
        with:
          path: output/breaking-ledger.json
          key: breaking-ledger-${{ github.run_id }}
          restore-keys: |
            breaking-ledger-

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Watch for breaking news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONO_MODEL_UTILITY: ${{ secrets.MONO_MODEL_UTILITY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EIC_DIGEST_TO: ${{ secrets.EIC_DIGEST_TO }}
          EIC_DIGEST_FROM: ${{ secrets.EIC_DIGEST_FROM }}
          NODE_ENV: production
        run: npm run breaking:watch -- --window=${{ github.event.inputs.window || '3' }}

      # The operator already got the instant email alert; this publishes the same
      # confirmed break(s) to The Wire as a one-click-merge PR. main is branch-
      # protected, so we open a PR rather than push. We accumulate onto ONE stable
      # branch (breaking/wire) — unioning with whatever unmerged breaks already sit
      # there — so two breaks between merges can't clobber each other's feed entry.
      - name: Publish The Wire as a Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain data/breaking.json)" ]; then
            echo "No new breaks this run — The Wire unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="breaking/wire"
          REPO="$GITHUB_REPOSITORY"
          git config user.name "MonoKromatik Agent"
          git config user.email "agents@monokromatik.com"

          # This run's feed (main's feed + the new hit) — stash it; switching branch
          # would discard the uncommitted change.
          cp data/breaking.json /tmp/wire-new.json

          # Clean the working tree before switching to the Wire branch. `npm install`
          # dirties package-lock.json, and the new feed is already saved to /tmp, so
          # discarding tracked changes here keeps `git checkout -B` from aborting
          # ("local changes would be overwritten by checkout").
          git checkout -- . 2>/dev/null || true

          # Preserve any breaks still queued on the existing Wire branch, THEN
          # rebuild the branch on top of CURRENT main. Basing the Wire branch on
          # main (not on its own diverged history) makes it always main + 1 commit
          # — so it's always cleanly mergeable, eliminating the recurring
          # breaking.json conflict that used to leave the Wire PR stuck.
          git fetch origin main -q
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH" -q
            git show "origin/$BRANCH:data/breaking.json" > /tmp/wire-existing.json 2>/dev/null || echo '{"breaks":[]}' > /tmp/wire-existing.json
          else
            echo '{"breaks":[]}' > /tmp/wire-existing.json
          fi
          git checkout -B "$BRANCH" origin/main -q

          # Union (this run's breaks ∪ the branch's unmerged breaks), dedup by link,
          # newest-first, cap 60 — so nothing already staged is lost.
          node -e '
            const fs = require("fs");
            const ex = JSON.parse(fs.readFileSync("/tmp/wire-existing.json","utf8")).breaks || [];
            const nw = JSON.parse(fs.readFileSync("/tmp/wire-new.json","utf8")).breaks || [];
            const seen = new Set(), out = [];
            for (const b of [...nw, ...ex]) { if (b && b.link && !seen.has(b.link)) { seen.add(b.link); out.push(b); } }
            out.sort((a,b) => new Date(b.detectedAt) - new Date(a.detectedAt));
            const feed = { updatedAt: (out[0] && out[0].detectedAt) || new Date().toISOString(), breaks: out.slice(0,60) };
            fs.writeFileSync("data/breaking.json", JSON.stringify(feed, null, 2) + "\n");
          '

          git add data/breaking.json
          # Rebased on main, the unioned feed can already equal main's — skip an
          # empty commit (would otherwise fail the run).
          if git diff --cached --quiet; then
            echo "Wire already current with main — nothing new to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "feat(wire): publish confirmed break(s) to The Wire" -m "AI-confirmed (importance >= 4) from trusted feeds. Rebased on main each run so the Wire PR is always cleanly mergeable. Merge to surface on /breaking + the homepage; close to discard."
          git push -f origin "$BRANCH"

          STAMP=$(date -u +"%Y-%m-%d %H:%MZ")
          COUNT=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/breaking.json","utf8")).breaks.length)')
          NUM=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$NUM" ]; then
            BODY="The breaking radar confirmed major break(s) in our focus segments and alerted you. This is the live Wire queue ($COUNT item(s)) for /breaking + the homepage strip — it accumulates new breaks until it merges. Each entry carries source, importance, the one-line read and detection time."
            gh pr create -R "$REPO" --base main --head "$BRANCH" --title "🔴 The Wire — breaking queue" --body "$BODY" || true
            NUM=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
            echo "Opened Wire PR #${NUM:-?} ($COUNT queued) — $STAMP." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Updated open Wire PR #$NUM ($COUNT queued) — $STAMP." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Standing policy: Wire breaks are pre-approved to publish (operator decision,
          # 2026-06-26). Arm GitHub auto-merge so the PR merges itself the moment the
          # required build check passes — fully autonomous once GH_PAT (CI on bot PRs)
          # and the repo's "Allow auto-merge" setting are in place. Harmless no-op until
          # then; the PR simply stays queued for a one-click merge.
          if [ -n "$NUM" ]; then
            if gh pr merge "$NUM" -R "$REPO" --auto --merge >/dev/null 2>&1; then
              echo "Auto-merge armed on Wire PR #$NUM." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Auto-merge not active yet (needs GH_PAT + repo 'Allow auto-merge') — #$NUM queued for merge." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
