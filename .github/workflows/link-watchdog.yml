name: Link Watchdog

# Weekly health check of every outbound citation — article sourceLinks, case-study
# sources, and video embeds (YouTube/Vimeo via oembed). Dead citations (404/410/
# DNS/timeout) are a credibility leak on an accuracy-led publication. Bot-blocked
# URLs (401/403/429) are reported but NOT treated as dead (false-positive guard).
#
# Read-only: it commits nothing. When dead links exist it opens (or reuses) a
# tracking issue for a human to fix in the content.

on:
  schedule:
    - cron: '30 3 * * 3' # Wednesday 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Check links + embeds
        run: npm run links:check

      - name: Open / update a tracking issue on dead links
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          DEAD=$(python3 -c "import json;print(len(json.load(open('output/link-health.json'))['dead']))")
          if [ "$DEAD" -eq 0 ]; then
            echo "✅ No dead links." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Build the issue body from the dead list.
          BODY=$(python3 -c "
          import json
          d=json.load(open('output/link-health.json'))
          print(f\"The weekly link watchdog found **{len(d['dead'])} dead citation(s)** ({d['ok']} ok, {d['blocked']} bot-blocked and ignored).\n\")
          for x in d['dead']:
              print(f\"- **{x['detail']}** — {x['where']}\n  {x['url']}\")
          print('\n_Auto-generated by .github/workflows/link-watchdog.yml. Fix the citations in data/ and close this issue._')
          ")

          TITLE="🔗 Link rot — $DEAD dead citation(s)"
          EXISTING=$(gh issue list --state open --search "Link rot in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            gh issue comment "$EXISTING" --body "Re-checked $(date -u +%Y-%m-%d): $DEAD dead citation(s) still present."
            echo "Updated issue #$EXISTING" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh issue create --title "$TITLE" --body "$BODY" --label "link-rot" 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY")
            echo "Opened $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
