name: Backfill Video

# Attach official/relevant video to the existing article back-catalogue using the
# same chain the live pipeline uses (publisher embed → YouTube → Pexels). New
# articles already get video at generation time, so this is manual-only. Defaults
# to dry-run: review the relevance in the run log, then re-run with dry_run=false
# to write + commit. No-ops if neither media key is set.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be attached without writing'
        type: boolean
        default: true
      since:
        description: 'Only articles published within this many days (blank = all)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Max articles to process (blank = all)'
        required: false
        default: ''
        type: string
      force:
        description: 'Re-source even articles that already have a video'
        type: boolean
        default: false

# main is protected (PR-only), so changes land via a review PR rather than a direct push.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: backfill-video
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MONO_STOCK_VIDEO: ${{ secrets.MONO_STOCK_VIDEO }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "Running: npm run backfill-video -- $ARGS"
          npm run backfill-video -- $ARGS

      - name: Open a review PR with the backfilled video
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain data/articles.json)" ]; then
            echo "ℹ️ No video changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="backfill/video-${{ github.run_id }}"
          git config user.name "MonoKromatik Agent"
          git config user.email "agents@monokromatik.com"
          git checkout -b "$BRANCH"
          git add data/articles.json
          git commit -m "chore(media): backfill video onto existing articles"
          git push origin "$BRANCH"

          BODY="One-shot video backfill — attached official/relevant video to existing articles in \`data/articles.json\` via the live chain (publisher embed → YouTube → Pexels). Review the data diff; **merging this PR is the publish step** (Vercel then redeploys). force: ${{ inputs.force }} · since: ${{ inputs.since || 'all' }} · limit: ${{ inputs.limit || 'all' }}."
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Video backfill — $(date -u +%Y-%m-%d)" --body "$BODY") || true

          if [ -n "$PR_URL" ]; then
            echo "Opened PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Video pushed to $BRANCH; open a PR from that branch if one was not created automatically." >> "$GITHUB_STEP_SUMMARY"
          fi
