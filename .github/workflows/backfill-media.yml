name: Backfill Article Media

# One-shot, manually triggered from the Actions tab. Re-sources credited media
# (reputable-first image + official/stock video) for the existing articles in
# data/articles.json and commits the result to main (Vercel then deploys).
#
# Needs repo secrets: PEXELS_API_KEY, ANTHROPIC_API_KEY (optional UNSPLASH_ACCESS_KEY).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report only, do not write or commit'
        type: boolean
        default: false
      only_missing:
        description: 'Only process articles that have no media credit yet'
        type: boolean
        default: true
      stock_video:
        description: 'Pull a relevant stock motion clip when no official video exists'
        type: boolean
        default: true
      limit:
        description: 'Max articles to process (blank = all)'
        required: false
        type: string

# This job intentionally writes content — distinct from the review-only pipeline.
# main is protected (PR-only), so changes land via a review PR rather than a direct push.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: backfill-media
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Backfill credited media
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MONO_STOCK_VIDEO: ${{ inputs.stock_video && 'on' || 'off' }}
          NODE_ENV: production
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.only_missing }}" = "true" ]; then ARGS="$ARGS --only-missing"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "Running: npm run backfill:media -- $ARGS"
          npm run backfill:media -- $ARGS

      - name: Open a review PR with the updated media
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain data/articles.json public/article-media)" ]; then
            echo "ℹ️ No media changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="backfill/media-${{ github.run_id }}"
          git config user.name "MonoKromatik Agent"
          git config user.email "agents@monokromatik.com"
          git checkout -b "$BRANCH"
          git add data/articles.json public/article-media
          git commit -m "chore(media): backfill self-hosted credited media for existing articles"
          git push origin "$BRANCH"

          BODY="One-shot media backfill — re-sourced credited media (reputable-first image + official/stock video) for the existing articles in \`data/articles.json\`, self-hosted under \`public/article-media\`. Review the data + asset diff; **merging this PR is the publish step** (Vercel then deploys). only-missing: ${{ inputs.only_missing }} · stock-video: ${{ inputs.stock_video }} · limit: ${{ inputs.limit || 'all' }}."
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Media backfill — $(date -u +%Y-%m-%d)" --body "$BODY") || true

          if [ -n "$PR_URL" ]; then
            echo "Opened PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Media pushed to $BRANCH; open a PR from that branch if one was not created automatically." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        if: always()
        run: |
          MODE="$([ "${{ inputs.dry_run }}" = "true" ] && echo 'dry run' || echo 'write')"
          echo "### Media backfill ($MODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "Stock video: ${{ inputs.stock_video }} · only-missing: ${{ inputs.only_missing }} · limit: ${{ inputs.limit || 'all' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Time: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
