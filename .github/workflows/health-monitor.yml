name: Health Monitor

# The watcher for the watchers. Every few hours it checks (1) that each scheduled
# automation is still succeeding — catching a silent failure like the Breaking
# Radar's (it failed unnoticed for 4 days) — and (2) that the key production
# routes return 2xx. Opens/updates a single tracking issue when anything's wrong.
# Read-only; commits nothing.

on:
  schedule:
    - cron: '0 */3 * * *' # every 3 hours
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Run health check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run health:check

      - name: Open / update a tracking issue on problems
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PROBLEMS=$(python3 -c "import json;d=json.load(open('output/health.json'));print(len(d['workflowIssues'])+len(d['routesDown']))")
          if [ "$PROBLEMS" -eq 0 ]; then
            echo "✅ All systems healthy." >> "$GITHUB_STEP_SUMMARY"
            # Auto-close a stale health issue if everything recovered.
            EXISTING=$(gh issue list --state open --search "System health in:title" --json number -q '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "✅ Recovered — all automations succeeding and all routes 2xx as of $(date -u +%Y-%m-%dT%H:%MZ). Closing."
              gh issue close "$EXISTING"
            fi
            exit 0
          fi

          BODY=$(python3 -c "
          import json
          d=json.load(open('output/health.json'))
          wf=d['workflowIssues']; rt=d['routesDown']
          print(f\"Health monitor found **{len(wf)} workflow issue(s)** and **{len(rt)} route(s) down** on {d['base']}.\n\")
          if wf:
              print('### 🔴 Failing automations')
              for w in wf: print(f\"- **{w['name']}** — {w['detail']}\n  {w['url']}\")
          if rt:
              print('\n### 🔴 Routes down')
              for r in rt: print(f\"- {r['route']} — {r['status']}\")
          print('\n_Auto-generated by .github/workflows/health-monitor.yml. It will auto-close when everything recovers._')
          ")

          TITLE="🚨 System health — $PROBLEMS issue(s)"
          EXISTING=$(gh issue list --state open --search "System health in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated issue #$EXISTING" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh issue create --title "$TITLE" --body "$BODY" --label "health" 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY")
            echo "Opened $URL" >> "$GITHUB_STEP_SUMMARY"
          fi
