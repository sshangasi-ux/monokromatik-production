name: CI

# Validate every PR (and pushes to main) before merge: typecheck + production
# build. This is the gate that was missing — code PRs now get checked
# automatically instead of relying on local verification.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
