name: CI

# Validate every PR (and pushes to main) before merge: typecheck + production
# build. This is the gate that was missing — code PRs now get checked
# automatically instead of relying on local verification.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Editorial firewall check
        run: npm run firewall:check

      - name: Validate content data
        run: npm run validate:data

      # Blocks a merge that would ship generic stock imagery, an untraceable
      # image, or the same picture reused across unrelated stories. Media must be
      # specific and true to the topic — this is the gate that keeps it so.
      - name: Media relevance
        run: npm run media:relevance

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
