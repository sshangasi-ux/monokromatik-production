name: CI

# Validate every PR (and pushes to main) before merge: typecheck + production
# build. This is the gate that was missing — PRs like the media/autonomy work
# now get checked automatically instead of relying on local verification.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

  lighthouse:
    # Non-blocking quality signal — builds, serves, and audits the homepage +
    # /pulse. The audit step is continue-on-error at the STEP level so the job
    # (and thus the PR check) stays green even if Lighthouse hiccups; results are
    # uploaded to temporary public storage and linked in the job log.
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/pulse
          startServerCommand: npm run start
          # Wait for Next.js to actually be listening before auditing, otherwise
          # Chrome hits connection-refused and reports CHROME_INTERSTITIAL_ERROR.
          startServerReadyPattern: 'Ready in'
          startServerReadyTimeout: 60000
          uploadArtifacts: true
          temporaryPublicStorage: true
